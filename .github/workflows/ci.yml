name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y autoconf automake

    - name: Generate build system
      run: aclocal && autoconf && autoheader && automake --add-missing

    - name: Configure
      run: ./configure

    - name: Build
      run: make

    - name: Verify binary
      run: ls -la src/setproctitle && file src/setproctitle

    - name: Run functional tests
      run: sudo tests/test_setproctitle.sh
